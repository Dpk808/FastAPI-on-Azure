version: "3.9"

services:

  db:
    image: postgres:17

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fastapi

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: fastapi-backend

    ports:
      - "8000:8000"

    depends_on:
      - db

  frontend:

    build:
      context: ./frontend

    container_name: react-frontend

    ports:
      - "3000:3000"

    stdin_open: true

    depends_on:
      - backend

volumes:
  postgres-data: